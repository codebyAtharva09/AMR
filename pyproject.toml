[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeswarm"
version = "1.0.0"
description = "EdgeSwarm: decentralized, radio-independent-safety fleet coordination for warehouse AMRs (SIH26123)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Team Regnum Carya" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pandas>=2.0", "matplotlib>=3.7", "scikit-learn>=1.3"]
edge = ["numpy>=1.24"]

[project.scripts]
edgeswarm = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]
